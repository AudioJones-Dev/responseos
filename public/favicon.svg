  <g fill="#FCFDFF">
    <!-- R stem -->
    <rect x="106" y="160" width="64" height="190" rx="6"/>
    <!-- R bowl with counter (evenodd) -->
    <path fill-rule="evenodd" d="M156 160 H206 C252 160 252 266 206 266 H156 Z M170 186 H202 C224 186 224 240 202 240 H170 Z"/>
