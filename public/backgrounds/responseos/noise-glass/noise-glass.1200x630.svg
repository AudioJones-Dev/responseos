<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ng-surf-1200" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101013"/>
      <stop offset="1" stop-color="#1B1B21"/>
    </linearGradient>
    <linearGradient id="ng-top-1200" x1="0" y1="0" x2="0" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ng-glow-1200" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(890 280) rotate(90) scale(250 320)">
      <stop offset="0" stop-color="#E8FF5A" stop-opacity="0.11"/>
      <stop offset="0.55" stop-color="#E8FF5A" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#E8FF5A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ng-vig-1200" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 315) rotate(90) scale(380 620)">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="ng-grid-1200" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#23232A" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <filter id="ng-grain-1200" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#08080A"/>
  <rect width="1200" height="630" fill="url(#ng-surf-1200)"/>
  <rect width="1200" height="630" fill="url(#ng-grid-1200)"/>
  <rect width="1200" height="630" fill="url(#ng-glow-1200)"/>
  <rect width="1200" height="630" fill="url(#ng-grain-1200)"/>
  <rect width="1200" height="630" fill="url(#ng-vig-1200)"/>
  <circle cx="890" cy="280" r="1.5" fill="#E8FF5A" fill-opacity="0.7"/>
  <circle cx="975" cy="375" r="1.1" fill="#E8FF5A" fill-opacity="0.35"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="url(#ng-top-1200)"/>
