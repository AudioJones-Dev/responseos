<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" fill="none">
  <defs>
    <linearGradient id="ng-surf-768" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101013"/>
      <stop offset="1" stop-color="#1B1B21"/>
    </linearGradient>
    <linearGradient id="ng-top-768" x1="0" y1="0" x2="0" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ng-glow-768" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(540 360) rotate(90) scale(300 320)">
      <stop offset="0" stop-color="#E8FF5A" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#E8FF5A" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#E8FF5A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ng-vig-768" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(384 512) rotate(90) scale(560 700)">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="ng-grid-768" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#23232A" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <filter id="ng-grain-768" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="768" height="1024" fill="#08080A"/>
  <rect width="768" height="1024" fill="url(#ng-surf-768)"/>
  <rect width="768" height="1024" fill="url(#ng-grid-768)"/>
  <rect width="768" height="1024" fill="url(#ng-glow-768)"/>
  <rect width="768" height="1024" fill="url(#ng-grain-768)"/>
  <rect width="768" height="1024" fill="url(#ng-vig-768)"/>
  <circle cx="540" cy="360" r="1.5" fill="#E8FF5A" fill-opacity="0.7"/>
  <circle cx="470" cy="470" r="1.1" fill="#E8FF5A" fill-opacity="0.35"/>
  <rect x="0.5" y="0.5" width="767" height="1023" fill="url(#ng-top-768)"/>
  <rect x="0.5" y="0.5" width="767" height="1023" rx="2" stroke="#2E2E36" stroke-opacity="0.6"/>
