<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="ng-surf-1920" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101013"/>
      <stop offset="1" stop-color="#1B1B21"/>
    </linearGradient>
    <linearGradient id="ng-top-1920" x1="0" y1="0" x2="0" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ng-glow-1920" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1430 470) rotate(90) scale(360 460)">
      <stop offset="0" stop-color="#E8FF5A" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#E8FF5A" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#E8FF5A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ng-vig-1920" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 540) rotate(90) scale(620 1020)">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="ng-grid-1920" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#23232A" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <filter id="ng-grain-1920" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#08080A"/>
  <rect width="1920" height="1080" fill="url(#ng-surf-1920)"/>
  <rect width="1920" height="1080" fill="url(#ng-grid-1920)"/>
  <rect width="1920" height="1080" fill="url(#ng-glow-1920)"/>
  <rect width="1920" height="1080" fill="url(#ng-grain-1920)"/>
  <rect width="1920" height="1080" fill="url(#ng-vig-1920)"/>
  <circle cx="1430" cy="470" r="1.6" fill="#E8FF5A" fill-opacity="0.7"/>
  <circle cx="1545" cy="610" r="1.2" fill="#E8FF5A" fill-opacity="0.35"/>
  <rect x="0.5" y="0.5" width="1919" height="1079" fill="url(#ng-top-1920)"/>
  <rect x="0.5" y="0.5" width="1919" height="1079" rx="2" stroke="#2E2E36" stroke-opacity="0.6"/>
</svg>
