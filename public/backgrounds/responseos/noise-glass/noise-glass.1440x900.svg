      <stop offset="0" stop-color="#101013"/>
      <stop offset="1" stop-color="#1B1B21"/>
    </linearGradient>
    <linearGradient id="ng-top-1440" x1="0" y1="0" x2="0" y2="2" gradientUnits="userSpaceOnUse">
