<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" fill="none">
  <defs>
    <linearGradient id="ng-surf-360" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101013"/>
      <stop offset="1" stop-color="#1B1B21"/>
    </linearGradient>
    <linearGradient id="ng-top-360" x1="0" y1="0" x2="0" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ng-glow-360" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 285) rotate(90) scale(190 215)">
      <stop offset="0" stop-color="#E8FF5A" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#E8FF5A" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#E8FF5A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ng-vig-360" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 400) rotate(90) scale(480 325)">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="ng-grid-360" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#23232A" stroke-width="1" stroke-opacity="0.42"/>
    </pattern>
    <filter id="ng-grain-360" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="360" height="800" fill="#08080A"/>
  <rect width="360" height="800" fill="url(#ng-surf-360)"/>
  <rect width="360" height="800" fill="url(#ng-grid-360)"/>
  <rect width="360" height="800" fill="url(#ng-glow-360)"/>
  <rect width="360" height="800" fill="url(#ng-grain-360)"/>
  <rect width="360" height="800" fill="url(#ng-vig-360)"/>
  <circle cx="250" cy="285" r="1.4" fill="#E8FF5A" fill-opacity="0.65"/>
  <rect x="0.5" y="0.5" width="359" height="799" fill="url(#ng-top-360)"/>
  <rect x="0.5" y="0.5" width="359" height="799" rx="2" stroke="#2E2E36" stroke-opacity="0.6"/>
</svg>
