    </radialGradient>
    <linearGradient id="ld-band-1024" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17171C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1B1B21" stop-opacity="0.55"/>
