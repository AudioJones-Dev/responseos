<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" fill="none">
  <defs>
    <radialGradient id="ld-bg-768" cx="50%" cy="58%" r="86%">
      <stop offset="0%" stop-color="#101013"/>
      <stop offset="48%" stop-color="#08080A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="ld-glow-768" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(232,255,90,0.20)"/>
      <stop offset="42%" stop-color="rgba(232,255,90,0.07)"/>
      <stop offset="100%" stop-color="rgba(232,255,90,0)"/>
    </radialGradient>
    <linearGradient id="ld-band-768" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#17171C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1B1B21" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#17171C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ld-rail-768" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2E36" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2E2E36" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#2E2E36" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2E2E36" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ld-grid-768" width="64" height="64" patternUnits="userSpaceOnUse">
