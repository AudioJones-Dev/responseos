  <rect width="768" height="1024" fill="url(#ld-bg-768)"/>
  <rect width="768" height="1024" fill="url(#ld-grid-768)"/>

  <g>
    <rect x="0" y="320" width="768" height="110" fill="url(#ld-band-768)"/>
    <rect x="0" y="490" width="768" height="110" fill="url(#ld-band-768)"/>
