      <stop offset="0%" stop-color="#08080A"/>
      <stop offset="60%" stop-color="#050506"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="sf-glow-1920" cx="50%" cy="50%" r="50%">
