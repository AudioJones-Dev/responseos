name: Live Demo Deployment Gate (closed)

on:
  workflow_dispatch:
    inputs:
      control_sha:
        description: Exact reviewed workflow-control commit
        required: true
        type: string
      application_sha:
        description: Exact reviewed application commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: responseos-frl-live-demo-exclusive
  cancel-in-progress: false

jobs:
  commissioning-gate:
    runs-on: ubuntu-latest
    env:
      CONTROL_SHA: ${{ inputs.control_sha }}
      APPLICATION_SHA: ${{ inputs.application_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      DISPATCH_REF: ${{ github.ref }}
    steps:
      - name: Validate revision binding and stop before hosted effects
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_REF" = refs/heads/master
          test "$CONTROL_SHA" = "$WORKFLOW_SHA"
          echo '::error::Deployment remains closed. Complete docs/readiness/FRL_LOCAL_HARDENING_2026-10-18.md commissioning gates and approve a separately reviewed activation change.'
          exit 1
