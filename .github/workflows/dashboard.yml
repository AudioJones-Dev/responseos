name: Build Progress Dashboard

# Keeps dashboard/dashboard-data.json in sync with live issue/PR state and
# (optionally) publishes the dashboard to GitHub Pages.
#
# Pages is OFF by default. To turn it on:
#   1. Settings > Pages > Build and deployment > Source: GitHub Actions
#   2. Settings > Secrets and variables > Actions > Variables: add ENABLE_PAGES = true

on:
  push:
    branches: [master]
    paths:
      - "dashboard/dashboard-data.json"
      - "dashboard/index.html"
      - "scripts/sync-dashboard.mjs"
      - ".github/workflows/dashboard.yml"
  issues:
    types: [opened, closed, reopened, edited, labeled, unlabeled]
  pull_request:
    types: [closed]
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
      issues: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Sync dashboard data from issues/PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-dashboard.mjs
      - name: Create or update dashboard sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_SYNC_BRANCH: automation/dashboard-sync
        run: |
          set -euo pipefail

          if git diff --quiet -- dashboard/dashboard-data.json; then
            echo "No data changes to propose."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "$DASHBOARD_SYNC_BRANCH"
          git add dashboard/dashboard-data.json
          git commit -m "chore(dashboard): sync progress data"

          if git ls-remote --exit-code --heads origin "$DASHBOARD_SYNC_BRANCH" >/dev/null 2>&1; then
            git fetch origin \
              "$DASHBOARD_SYNC_BRANCH:refs/remotes/origin/$DASHBOARD_SYNC_BRANCH"
            remote_sha="$(git rev-parse "refs/remotes/origin/$DASHBOARD_SYNC_BRANCH")"
            git push \
              --force-with-lease="refs/heads/$DASHBOARD_SYNC_BRANCH:$remote_sha" \
              origin "HEAD:refs/heads/$DASHBOARD_SYNC_BRANCH"
          else
            git push --set-upstream origin "$DASHBOARD_SYNC_BRANCH"
          fi

          pr_number="$(
            gh pr list \
              --base master \
              --head "$DASHBOARD_SYNC_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$pr_number" ]; then
            gh pr create \
              --base master \
              --head "$DASHBOARD_SYNC_BRANCH" \
              --title "chore(dashboard): sync progress data" \
              --body "Automated dashboard refresh. Approve the workflow runs, then review and merge manually after required checks pass."
          else
            echo "Dashboard sync pull request #$pr_number is already open."
          fi
      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard

  deploy:
    needs: sync
    if: ${{ vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
