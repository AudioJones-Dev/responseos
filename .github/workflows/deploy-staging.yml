# Staging-only deploy scaffold (Path A / Live Pilot Ship Phase 2).
#
# Hard rules:
# - Manual trigger only (workflow_dispatch). Never runs on push to master.
# - Uses the GitHub Environment named `staging` so required reviewers /
#   wait timers can gate the job (create that Environment in repo Settings).
# - Does NOT deploy production. Do not add a production job here until
#   founding-pilot readiness gates + human prod approval clear.
# - Providers stay mock until separately authorized live stages.
#
# Operator setup (secrets + Neon + Clerk) is documented in:
#   docs/ops/RESPONSEOS_STAGING_HOSTING_RUNBOOK.md

name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to confirm a non-production deploy'
        required: true
        type: string
      sha:
        description: "Exact reviewed 40-character commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm staging intent
    runs-on: ubuntu-latest
    steps:
      - name: Reject accidental triggers
        if: ${{ inputs.confirm != 'staging' }}
        run: |
          echo "::error::Confirmation input must be exactly 'staging'. Refusing deploy."
          exit 1

  deploy-staging:
    name: Deploy to staging
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Prefer environment-scoped token; fall back to repo secret name.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      RESPONSEOS_BUILD_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      - name: Verify exact reviewed SHA
        shell: bash
        run: |
          if [[ ! "${{ inputs.sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character lowercase commit SHA."
            exit 1
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "${{ inputs.sha }}" ]; then
            echo "::error::Checked-out SHA does not match the requested reviewed SHA."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Require deploy secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL DIRECT_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name (set on GitHub Environment 'staging' or repo secrets). See docs/ops/RESPONSEOS_STAGING_HOSTING_RUNBOOK.md"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - run: npm ci
      - run: npx prisma generate

      - name: Install Vercel CLI
        run: |
          npm install -g vercel@52.2.1
          vercel --version

      - name: Verify Vercel project token access
        shell: bash
        run: |
          status=$(curl --silent --show-error --max-time 30 \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          if [ "$status" != "200" ]; then
            echo "::error::Vercel project access preflight failed with HTTP $status."
            exit 1
          fi

      - name: Pull Vercel staging env metadata
        run: vercel pull --yes --environment=preview

      - name: Validate mock-only staging environment
        run: node scripts/validate-staging-env.mjs .vercel/.env.preview.local

      - name: Migrate staging database
        run: npx prisma migrate deploy

      - name: Build for Vercel
        run: vercel build

      - name: Deploy prebuilt to Vercel (non-prod)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed staging candidate: $url"
          echo "::notice::Alias/promote to the staging hostname is an operator step — see RESPONSEOS_STAGING_HOSTING_RUNBOOK.md. This job never targets production."

      - name: Verify staging candidate
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          health=$(curl --fail --silent --show-error --max-time 30 "$DEPLOYMENT_URL/api/health")
          actual_sha=$(printf '%s' "$health" | jq -r '.build_sha')
          if [ "$actual_sha" != "${{ inputs.sha }}" ]; then
            echo "::error::Health build SHA does not match the reviewed workflow SHA."
            exit 1
          fi

          public_code=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/demo")
          if [ "$public_code" != "200" ]; then
            echo "::error::Public demo smoke failed with HTTP $public_code."
            exit 1
          fi

          for path in /admin /client/dashboard /api/calls /api/auth/session; do
            code=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL$path")
            case "$code" in
              301|302|303|307|308|401|403|404) ;;
              *)
                echo "::error::Protected-path smoke failed for $path with HTTP $code."
                exit 1
                ;;
            esac
          done
