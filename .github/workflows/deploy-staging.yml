# Governed mock-staging deployment. Manual dispatch and protected Environment only.
# It certifies the exact custom environment before migration and never aliases,
# promotes, targets Production, or enables live providers.

name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to confirm a non-production deploy'
        required: true
        type: string
      control_sha:
        description: "Exact 40-character current master workflow-control SHA"
        required: true
        type: string
      application_sha:
        description: "Exact reviewed 40-character application SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: responseos-staging-exclusive
  cancel-in-progress: false

jobs:
  guard:
    name: Bind controls to current master
    runs-on: ubuntu-latest
    env:
      DISPATCH_CONFIRM: ${{ inputs.confirm }}
      CONTROL_SHA: ${{ inputs.control_sha }}
      APPLICATION_SHA: ${{ inputs.application_sha }}
      DISPATCH_REF: ${{ github.ref }}
      DISPATCHED_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Validate dispatch contract
        run: |
          if [ "$DISPATCH_CONFIRM" != "staging" ]; then
            echo "::error::Confirmation must be exactly staging."
            exit 1
          fi
          if [ "$DISPATCH_REF" != "refs/heads/master" ]; then
            echo "::error::Deploy Staging must be dispatched from master."
            exit 1
          fi
          if [[ ! "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::control_sha must be a full lowercase commit SHA."
            exit 1
          fi
          if [[ ! "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::application_sha must be a full lowercase commit SHA."
            exit 1
          fi
          if [ "$CONTROL_SHA" != "$DISPATCHED_WORKFLOW_SHA" ]; then
            echo "::error::control_sha must equal the workflow SHA dispatched from master."
            exit 1
          fi

      - name: Check out exact workflow controls
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.control_sha }}

      - name: Verify controls are still current master
        run: |
          if [ "$(git rev-parse HEAD)" != "$CONTROL_SHA" ]; then
            echo "::error::Checked-out controls do not match control_sha."
            exit 1
          fi
          remote_master=$(git ls-remote origin refs/heads/master | awk '{print $1}')
          if [ "$remote_master" != "$CONTROL_SHA" ]; then
            echo "::error::control_sha is no longer current master."
            exit 1
          fi

  deploy-staging:
    name: Migrate and deploy governed staging
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: source
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      EXPECTED_VERCEL_PROJECT_NAME: responseos-staging-mock
      EXPECTED_VERCEL_PROJECT_ID: prj_pbzqdkzp322jcHWIsi19GhsnWXRm
      EXPECTED_VERCEL_ORG_ID: team_BHxIkAGPW6qEKKQBAt9c0NGz
      EXPECTED_VERCEL_CUSTOM_ENV_ID: env_uX6Qp8F6w9aBgx2ikH3BiREB8aHH
      EXPECTED_VERCEL_CUSTOM_ENV_SLUG: staging
      EXPECTED_VERCEL_MANAGED_ALIAS: responseos-staging-mock-env-staging-audiojones.vercel.app
      EXPECTED_NEON_PROJECT_NAME: responseos-staging-mock
      EXPECTED_NEON_PROJECT_ID: patient-snow-16014934
      EXPECTED_NEON_BRANCH_NAME: main
      EXPECTED_NEON_BRANCH_ID: br-mute-boat-a6ylen11
      EXPECTED_NEON_ENDPOINT_ID: ep-young-morning-a6oeu9vv
      EXPECTED_NEON_DATABASE_NAME: neondb
      CONTROL_SHA: ${{ inputs.control_sha }}
      APPLICATION_SHA: ${{ inputs.application_sha }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
    steps:
      - name: Check out exact workflow controls
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.control_sha }}
          path: workflow-control

      - name: Check out exact reviewed application source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.application_sha }}
          path: source

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Verify exact checkouts, current master, and required secrets
        run: |
          if [ "$(git rev-parse HEAD)" != "$APPLICATION_SHA" ]; then
            echo "::error::Application checkout does not match application_sha."
            exit 1
          fi
          if [ "$(git -C ../workflow-control rev-parse HEAD)" != "$CONTROL_SHA" ]; then
            echo "::error::Workflow-control checkout does not match control_sha."
            exit 1
          fi
          remote_master=$(git -C ../workflow-control ls-remote origin refs/heads/master | awk '{print $1}')
          if [ "$remote_master" != "$CONTROL_SHA" ]; then
            echo "::error::Workflow controls changed while this protected job was waiting."
            exit 1
          fi
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_AUTOMATION_BYPASS_SECRET NEON_API_KEY DATABASE_URL DIRECT_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing staging Environment secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "$VERCEL_ORG_ID" != "$EXPECTED_VERCEL_ORG_ID" ] || [ "$VERCEL_PROJECT_ID" != "$EXPECTED_VERCEL_PROJECT_ID" ]; then
            echo "::error::GitHub staging Vercel ids are not canonical."
            exit 1
          fi

      - name: Verify protected non-production Vercel project
        run: |
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-project.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$EXPECTED_VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-project-domains.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$EXPECTED_VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID"
          node ../workflow-control/scripts/validate-staging-vercel-project.mjs "$RUNNER_TEMP/vercel-project.json" "$RUNNER_TEMP/vercel-project-domains.json"

      - name: Verify exact governed custom environment
        run: |
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-custom-environment.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$EXPECTED_VERCEL_PROJECT_ID/custom-environments/$EXPECTED_VERCEL_CUSTOM_ENV_ID?teamId=$VERCEL_ORG_ID"
          node ../workflow-control/scripts/staging-vercel-custom-environment.mjs "$RUNNER_TEMP/vercel-custom-environment.json"

      - name: Validate governed custom-environment posture
        run: |
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-env-unfiltered.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v10/projects/$EXPECTED_VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-custom-env.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v10/projects/$EXPECTED_VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&customEnvironmentId=$EXPECTED_VERCEL_CUSTOM_ENV_ID"
          node ../workflow-control/scripts/fetch-staging-vercel-readable-env.mjs final custom-environment "$RUNNER_TEMP/vercel-custom-env.json" "$RUNNER_TEMP/vercel-custom-readable.json"
          node ../workflow-control/scripts/validate-staging-vercel-posture.mjs custom-environment "$RUNNER_TEMP/vercel-custom-readable.json" "$RUNNER_TEMP/vercel-env-unfiltered.json"

      - name: Fetch canonical Neon identity
        run: |
          neon_api="https://console.neon.tech/api/v2/projects/$EXPECTED_NEON_PROJECT_ID"
          auth_header="Authorization: Bearer $NEON_API_KEY"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/neon-project.json" --header "$auth_header" "$neon_api"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/neon-branch.json" --header "$auth_header" "$neon_api/branches/$EXPECTED_NEON_BRANCH_ID"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/neon-endpoints.json" --header "$auth_header" "$neon_api/endpoints"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/neon-databases.json" --header "$auth_header" "$neon_api/branches/$EXPECTED_NEON_BRANCH_ID/databases"

      - name: Certify canonical database and current v2 attestation
        run: |
          node ../workflow-control/scripts/validate-staging-database-source.mjs "$RUNNER_TEMP/neon-project.json" "$RUNNER_TEMP/neon-branch.json" "$RUNNER_TEMP/neon-endpoints.json" "$RUNNER_TEMP/neon-databases.json"
          node ../workflow-control/scripts/validate-staging-env.mjs "$RUNNER_TEMP/vercel-custom-readable.json" "$RUNNER_TEMP/vercel-env-unfiltered.json" "$RUNNER_TEMP/neon-project.json" "$RUNNER_TEMP/neon-branch.json" "$RUNNER_TEMP/neon-endpoints.json" "$RUNNER_TEMP/neon-databases.json"

      - name: Install application dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install pinned Vercel CLI without linking
        run: npm install --global vercel@59.4.0

      - name: Check migration status
        run: |
          set +e
          npx prisma migrate status > "$RUNNER_TEMP/prisma-migrate-status.txt" 2>&1
          status=$?
          set -e
          node ../workflow-control/scripts/validate-prisma-migration-status.mjs "$RUNNER_TEMP/prisma-migrate-status.txt" "$status"

      - name: Refresh certification immediately before migration
        run: |
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-project.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$EXPECTED_VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-project-domains.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$EXPECTED_VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID"
          node ../workflow-control/scripts/validate-staging-vercel-project.mjs "$RUNNER_TEMP/vercel-project.json" "$RUNNER_TEMP/vercel-project-domains.json"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-custom-environment.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$EXPECTED_VERCEL_PROJECT_ID/custom-environments/$EXPECTED_VERCEL_CUSTOM_ENV_ID?teamId=$VERCEL_ORG_ID"
          node ../workflow-control/scripts/staging-vercel-custom-environment.mjs "$RUNNER_TEMP/vercel-custom-environment.json"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-env-unfiltered.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v10/projects/$EXPECTED_VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-custom-env.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v10/projects/$EXPECTED_VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&customEnvironmentId=$EXPECTED_VERCEL_CUSTOM_ENV_ID"
          node ../workflow-control/scripts/fetch-staging-vercel-readable-env.mjs final custom-environment "$RUNNER_TEMP/vercel-custom-env.json" "$RUNNER_TEMP/vercel-custom-readable.json"
          node ../workflow-control/scripts/validate-staging-vercel-posture.mjs custom-environment "$RUNNER_TEMP/vercel-custom-readable.json" "$RUNNER_TEMP/vercel-env-unfiltered.json"
          neon_api="https://console.neon.tech/api/v2/projects/$EXPECTED_NEON_PROJECT_ID"
          auth_header="Authorization: Bearer $NEON_API_KEY"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/neon-project.json" --header "$auth_header" "$neon_api"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/neon-branch.json" --header "$auth_header" "$neon_api/branches/$EXPECTED_NEON_BRANCH_ID"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/neon-endpoints.json" --header "$auth_header" "$neon_api/endpoints"
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/neon-databases.json" --header "$auth_header" "$neon_api/branches/$EXPECTED_NEON_BRANCH_ID/databases"
          node ../workflow-control/scripts/validate-staging-database-source.mjs "$RUNNER_TEMP/neon-project.json" "$RUNNER_TEMP/neon-branch.json" "$RUNNER_TEMP/neon-endpoints.json" "$RUNNER_TEMP/neon-databases.json"
          node ../workflow-control/scripts/validate-staging-env.mjs "$RUNNER_TEMP/vercel-custom-readable.json" "$RUNNER_TEMP/vercel-env-unfiltered.json" "$RUNNER_TEMP/neon-project.json" "$RUNNER_TEMP/neon-branch.json" "$RUNNER_TEMP/neon-endpoints.json" "$RUNNER_TEMP/neon-databases.json"

      - name: Migrate canonical staging database
        id: migrate
        run: |
          npx prisma migrate deploy
          printf '{"outcome":"succeeded"}\n' > "$RUNNER_TEMP/staging-migration-outcome.json"

      - name: Deploy exact source to governed custom environment
        id: deploy
        run: |
          set +x
          deployment_output="$RUNNER_TEMP/vercel-deploy-output.txt"
          vercel deploy --yes --force \
            --target "$EXPECTED_VERCEL_CUSTOM_ENV_SLUG" \
            --project "$EXPECTED_VERCEL_PROJECT_ID" \
            --token "$VERCEL_TOKEN" \
            --build-env "RESPONSEOS_BUILD_SHA=$APPLICATION_SHA" \
            --env "RESPONSEOS_BUILD_SHA=$APPLICATION_SHA" \
            --meta "responseosApplicationSha=$APPLICATION_SHA" \
            > "$deployment_output"
          deployment_url=$(tail -n 1 "$deployment_output" | tr -d '\r')
          node ../workflow-control/scripts/validate-staging-deployment-result.mjs url "$deployment_url" "$APPLICATION_SHA"
          deployment_host=${deployment_url#https://}
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "host=$deployment_host" >> "$GITHUB_OUTPUT"
          echo "Governed staging deployment created; no alias or promotion requested."

      - name: Wait for exact governed deployment to become READY
        id: ready
        env:
          DEPLOYMENT_HOST: ${{ steps.deploy.outputs.host }}
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-deployment.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$DEPLOYMENT_HOST?teamId=$VERCEL_ORG_ID&withGitRepoInfo=true"
            node ../workflow-control/scripts/validate-staging-deployment-result.mjs progress "$RUNNER_TEMP/vercel-deployment.json" "$APPLICATION_SHA" "$DEPLOYMENT_HOST"
            state=$(jq -r '.readyState // .state // .status // empty' "$RUNNER_TEMP/vercel-deployment.json")
            case "$state" in
              READY)
                node ../workflow-control/scripts/validate-staging-deployment-result.mjs ready "$RUNNER_TEMP/vercel-deployment.json" "$APPLICATION_SHA" "$DEPLOYMENT_HOST"
                deployment_id=$(jq -er '.id | select(type == "string" and test("^dpl_[A-Za-z0-9]+$"))' "$RUNNER_TEMP/vercel-deployment.json")
                echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              ERROR|CANCELED|CANCELLED)
                echo "::error::Governed staging deployment reached terminal state $state."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for governed staging deployment readiness."
          exit 1

      - name: Bind managed alias to exact READY deployment
        env:
          DEPLOYMENT_HOST: ${{ steps.deploy.outputs.host }}
          DEPLOYMENT_ID: ${{ steps.ready.outputs.deployment_id }}
        run: |
          for attempt in $(seq 1 60); do
            http_code=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-managed-alias.json" --write-out '%{http_code}' --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v4/aliases/$EXPECTED_VERCEL_MANAGED_ALIAS?teamId=$VERCEL_ORG_ID&projectId=$EXPECTED_VERCEL_PROJECT_ID")
            case "$http_code" in
              200)
                set +e
                node ../workflow-control/scripts/validate-staging-managed-alias.mjs poll "$RUNNER_TEMP/vercel-managed-alias.json" "$DEPLOYMENT_ID" "$DEPLOYMENT_HOST"
                alias_status=$?
                set -e
                case "$alias_status" in
                  0)
                    echo "Canonical managed staging alias is bound to the exact READY deployment."
                    exit 0
                    ;;
                  2) ;;
                  *) exit 1 ;;
                esac
                ;;
              404) ;;
              *)
                echo "::error::Managed staging alias lookup failed with HTTP $http_code."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for the canonical managed alias to bind to the exact READY deployment."
          exit 1

      - name: Reverify final custom-environment routing
        run: |
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/vercel-custom-environment-post-ready.json" --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$EXPECTED_VERCEL_PROJECT_ID/custom-environments/$EXPECTED_VERCEL_CUSTOM_ENV_ID?teamId=$VERCEL_ORG_ID"
          node ../workflow-control/scripts/staging-vercel-custom-environment.mjs "$RUNNER_TEMP/vercel-custom-environment-post-ready.json" post-ready

      - name: Verify protected health and Clerk auth-boundary smoke
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          MANAGED_ALIAS_URL: https://responseos-staging-mock-env-staging-audiojones.vercel.app
        run: |
          bypass_header="x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"
          health=$(curl --fail --silent --show-error --max-time 30 --header "$bypass_header" "$DEPLOYMENT_URL/api/health")
          actual_sha=$(printf '%s' "$health" | jq -r '.build_sha')
          if [ "$actual_sha" != "$APPLICATION_SHA" ]; then
            echo "::error::Health build SHA does not match application_sha."
            exit 1
          fi
          alias_health=$(curl --fail --silent --show-error --max-time 30 --header "$bypass_header" "$MANAGED_ALIAS_URL/api/health")
          alias_sha=$(printf '%s' "$alias_health" | jq -r '.build_sha')
          if [ "$alias_sha" != "$APPLICATION_SHA" ]; then
            echo "::error::Managed-alias health build SHA does not match application_sha."
            exit 1
          fi
          public_code=$(curl --silent --show-error --max-time 30 --header "$bypass_header" --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/demo")
          if [ "$public_code" != "200" ]; then
            echo "::error::Public demo smoke failed with HTTP $public_code."
            exit 1
          fi
          # The shared validator reads Clerk environment metadata with GET, then classifies
          # direct Account Portal or exact FAPI handshake redirects without following them.
          node ../workflow-control/scripts/validate-staging-protected-route-smoke.mjs "$DEPLOYMENT_URL" "$RUNNER_TEMP/vercel-custom-readable.json"

      - name: Record SAFE STOP after a post-migration failure
        if: ${{ failure() && steps.migrate.outcome == 'success' }}
        run: |
          echo "::error::SAFE STOP after staging migration. No schema rollback, alias, promotion, or production action was attempted."
          if [ -s "$RUNNER_TEMP/vercel-deployment.json" ]; then
            node ../workflow-control/scripts/validate-staging-deployment-result.mjs report "$RUNNER_TEMP/vercel-deployment.json" "$APPLICATION_SHA" || true
          else
            echo "No governed deployment readback was recorded."
          fi
