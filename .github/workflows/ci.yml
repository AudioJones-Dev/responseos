name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (blocking, ADR-0063)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only until GHSA-vfj7-8cjw-p6xm has a fix, ADR-0063)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: responseos
          POSTGRES_PASSWORD: responseos
          POSTGRES_DB: responseos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U responseos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://responseos:responseos@localhost:5432/responseos_test
      DIRECT_URL: postgresql://responseos:responseos@localhost:5432/responseos_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (blocking, ADR-0063)
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Provision dedicated Prisma shadow database
        run: |
          PGPASSWORD=responseos psql -h localhost -U responseos \
            -d responseos_test -c 'CREATE DATABASE responseos_shadow;'
      - run: npx prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-migrations prisma/migrations --shadow-database-url "postgresql://responseos:responseos@localhost:5432/responseos_shadow" --exit-code
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - name: Validate inactive Render specification
        run: node scripts/validate-routing-blueprint.mjs
      - run: npm run test:integration
      - name: Synthetic PostgreSQL logical restore drill
        env:
          ROUTING_RESTORE_SYNTHETIC_ONLY: "true"
          ROUTING_RESTORE_SNAPSHOT: ${{ runner.temp }}/routing-restore.json
          PGPASSWORD: responseos
        run: |
          node --import tsx scripts/routing-restore-drill.ts prepare
          docker exec ${{ job.services.postgres.id }} pg_dump -Fc -U responseos -d responseos_test > "$RUNNER_TEMP/routing.dump"
          psql -h localhost -U responseos -d postgres -c 'CREATE DATABASE responseos_restore;'
          docker exec -i ${{ job.services.postgres.id }} pg_restore --exit-on-error --no-owner -U responseos -d responseos_restore < "$RUNNER_TEMP/routing.dump"
          DATABASE_URL=postgresql://responseos:responseos@localhost:5432/responseos_restore DIRECT_URL=postgresql://responseos:responseos@localhost:5432/responseos_restore node --import tsx scripts/routing-restore-drill.ts verify
      - run: npm run build
