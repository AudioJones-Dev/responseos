name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (blocking, ADR-0063)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only until GHSA-vfj7-8cjw-p6xm has a fix, ADR-0063)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration-matrix:
    name: integration (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: responseos
          POSTGRES_PASSWORD: responseos
          POSTGRES_DB: responseos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U responseos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://responseos:responseos@localhost:5432/responseos_test
      DIRECT_URL: postgresql://responseos:responseos@localhost:5432/responseos_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (blocking, ADR-0063)
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Provision dedicated Prisma shadow database
        run: |
          PGPASSWORD=responseos psql -h localhost -U responseos \
            -d responseos_test -c 'CREATE DATABASE responseos_shadow;'
      - run: npx prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-migrations prisma/migrations --shadow-database-url "postgresql://responseos:responseos@localhost:5432/responseos_shadow" --exit-code
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run test:integration
      - name: Restore synthetic database into a separate target
        run: |
          container='${{ job.services.postgres.id }}'
          docker exec "$container" pg_dump -U responseos -d responseos_test --format=custom --no-owner --no-acl > /tmp/responseos.dump
          docker exec "$container" createdb -U responseos responseos_restore
          docker exec -i "$container" pg_restore -U responseos -d responseos_restore --no-owner --no-acl --exit-on-error < /tmp/responseos.dump
          for db in responseos_test responseos_restore; do
            docker exec -i "$container" psql -U responseos -d "$db" -At -v ON_ERROR_STOP=1 < scripts/database-reconciliation.sql > "/tmp/$db.reconciliation"
          done
          diff /tmp/responseos_test.reconciliation /tmp/responseos_restore.reconciliation
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-url "postgresql://responseos:responseos@localhost:5432/responseos_restore" --exit-code
      - run: npm run build

  # Branch protection requires a check named "integration"; it passes only
  # when every PostgreSQL version in the matrix passed.
  integration:
    needs: integration-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.integration-matrix.result }}" = "success"
